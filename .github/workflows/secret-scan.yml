name: secret-scan

# 脱敏兜底：本地 pre-commit 钩子可被 --no-verify 绕过，这里在 GitHub 侧再扫一遍。
# 公开仓库，任何 push / PR 都会触发；每周再全历史复查一次。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * 1'   # 每周一 02:00（北京时间）全历史复查
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 全历史，不只扫最新一次提交

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE 仅私有仓库/组织需要；本仓库公开，无需配置
          # 需要更严的规则时在仓库根加 .gitleaks.toml
