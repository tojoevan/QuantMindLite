<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>慢量化操作台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=27" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
  <script>
    (function(){ try { if (localStorage.getItem('qw_theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch(e){} })();
  </script>
  <link rel="stylesheet" href="/style.css?v=74" />
  <script src="/vendor/echarts.min.js?v=27"></script>
</head>
<body>
  <header>
    <button id="menu-btn" class="menu-btn" aria-label="菜单">☰</button>
    <div class="brand">
      <a id="brand-link" class="brand-link" href="javascript:void(0)" title="返回首页" aria-label="返回首页"><h1>慢量化操作台</h1></a>
      <span class="sub">建议 → 反馈 → 再预测</span>
    </div>
    <div class="top-actions">
      <a id="btn-news" class="top-link" data-nav="news">资讯</a>
      <a id="btn-roundtable" class="top-link" data-nav="roundtable">圆桌</a>
      <a id="btn-forum" class="top-link" data-nav="forum">论坛</a>
      <a id="btn-dashboard" class="top-link" data-nav="dashboard">交易仪表台</a>
      <a id="btn-about" class="top-link" data-nav="about">关于</a>
      <a id="nav-users" class="top-link hidden" data-nav="users">用户管理</a>
      <a id="btn-github" class="top-link" href="https://github.com/tojoevan/QuantMindLite" target="_blank" rel="noopener" title="GitHub 开源仓库">GitHub</a>
      <button id="btn-theme" class="theme-btn" type="button" title="切换浅色 / 深色" aria-label="切换主题">🌙</button>
      <div id="user-chip" class="user-chip hidden"></div>
    </div>
  </header>

  <!-- 主区（P6：侧栏已退场，全站单列全宽） -->
  <div class="layout">
    <main class="main" id="main">
      <div class="placeholder">加载中…</div>
    </main>
  </div>

  <!-- 移动端导航抽屉（P6：侧栏删除后导航的新家；桌面隐藏，仅小屏由 ☰ 打开） -->
  <div class="nav-drawer" id="nav-drawer">
    <div class="nav-drawer-head">
      <span class="nd-title">导航</span>
      <button class="nd-close" id="nav-drawer-close" type="button" aria-label="关闭菜单">✕</button>
    </div>
    <div id="side-links" class="side-links">
      <a id="drawer-news" class="side-link" data-nav="news">资讯</a>
      <a id="drawer-roundtable" class="side-link" data-nav="roundtable">圆桌</a>
      <a id="drawer-forum" class="side-link" data-nav="forum">论坛</a>
      <a id="drawer-dashboard" class="side-link" data-nav="dashboard">交易仪表台</a>
      <a id="drawer-about" class="side-link" data-nav="about">关于</a>
      <a id="drawer-users" class="side-link hidden" data-nav="users">用户管理</a>
      <a id="drawer-github" class="side-link" href="https://github.com/tojoevan/QuantMindLite" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <!-- 新建标的弹窗（登录态 · 由交易仪表台页头「＋ 新建标的」打开）
       注意：表单固定在文档层而非仪表台 innerHTML 内——其 onsubmit 绑定在模块顶层只执行一次，
       若随主区重渲染会被重建而丢失绑定。 -->
  <div id="project-modal" class="pm-root hidden">
    <div class="pm-mask" id="pm-mask"></div>
    <div class="pm-card" role="dialog" aria-modal="true" aria-label="新建标的">
      <div class="pm-head">
        <h3>新建标的</h3>
        <button class="pm-close" id="pm-close" type="button" aria-label="关闭">✕</button>
      </div>
      <form id="project-form" class="card">
        <input id="p-name" placeholder="标的名称（如 贵州茅台）" required />
        <input id="p-code" placeholder="标的代码（如 600519.SH）" autocomplete="off" />
        <select id="p-market">
          <option value="A">股票</option>
          <option value="etf">场内基金（ETF / LOF）</option>
          <option value="fund">场外基金</option>
          <option value="bond">债券（可转债 / 国债）</option>
        </select>
        <div id="p-lookup" class="pm-lookup hidden"></div>
        <div id="p-hint" class="pm-hint muted"></div>
        <select id="p-bias">
          <option value="neutral">中性</option>
          <option value="long">偏多</option>
          <option value="short">偏空</option>
        </select>
        <select id="p-strategy-type">
          <option value="momentum">策略：动量</option>
          <option value="meanreversion">策略：均值回归</option>
          <option value="breakout">策略：通道突破</option>
          <option value="baseline">策略：基线演示</option>
        </select>
        <textarea id="p-strategy" placeholder="策略说明(可选)"></textarea>
        <button type="submit">＋ 新建标的</button>
      </form>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <!-- 登录 / 注册 / 忘记密码 门禁 -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <h1>慢量化操作台</h1>
      <p class="muted">登录后使用 · 用户名为邮箱地址</p>
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" type="button">登录</button>
        <button id="tab-register" class="auth-tab" type="button">注册</button>
      </div>
      <form id="form-login" class="auth-form">
        <input id="login-email" type="email" placeholder="邮箱地址" autocomplete="username" required />
        <input id="login-pw" type="password" placeholder="密码" autocomplete="current-password" required />
        <button type="submit">登录</button>
        <a id="link-forgot" class="auth-link" href="javascript:void(0)">忘记密码？</a>
      </form>
      <form id="form-register" class="auth-form hidden">
        <input id="reg-email" type="email" placeholder="邮箱地址" autocomplete="username" required />
        <input id="reg-pw" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" required />
        <input id="reg-pw2" type="password" placeholder="确认密码" autocomplete="new-password" required />
        <button type="submit">注册</button>
        <div class="muted">首个注册的用户将自动成为管理员。</div>
      </form>
      <form id="form-forgot" class="auth-form hidden">
        <input id="forgot-email" type="email" placeholder="邮箱地址" required />
        <button type="submit">提交重置申请</button>
        <a id="link-back" class="auth-link" href="javascript:void(0)">返回登录</a>
      </form>
      <button id="btn-guest" class="auth-guest" type="button">游客访问（只读 · 仅展示 000002.SZ）</button>
      <div id="auth-msg" class="auth-msg"></div>
    </div>
  </div>

  <!-- 前端脚本按序加载（经典脚本，共享全局作用域）：由原 app.js 按顶层边界原样拆分 -->
  <script src="/js/01-core.js?v=60"></script>
  <script src="/js/02-dashboard.js?v=60"></script>
  <script src="/js/03-auth.js?v=61"></script>
  <script src="/js/04-about-users.js?v=60"></script>
  <script src="/js/05-roundtable.js?v=64"></script>
  <script src="/js/06-pages.js?v=60"></script>
  <script src="/js/07-forum.js?v=62"></script>
  <script src="/js/08-news.js?v=73"></script>
</body>
</html>
